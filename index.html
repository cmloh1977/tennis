<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tennis Reaction Trainer</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000; color: #fff;
      font-family: -apple-system, system-ui, sans-serif; text-align: center;
    }
    h1 { font-size: 2.2rem; margin: 0 16px 12px; }
    p { font-size: 1.1rem; margin: 4px 16px; color: #ccc; }
  </style>
</head>
<body>
  <h1>Tennis Reaction Trainer</h1>
  <p>Hello! The secure address works.</p>
  <p id="check"></p>
  <p>Version 0.1</p>
  <script>
    // Step 1 check: wake lock needs a secure (https) address.
    document.getElementById('check').textContent =
      window.isSecureContext ? 'Secure (https): yes' : 'Secure (https): no';
  </script>
</body>
</html>
