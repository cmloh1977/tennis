<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Tennis Reaction Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Home screen: pick a mode and start -->
  <main id="home" class="screen">
    <h1>Tennis Reaction Trainer</h1>
    <div id="modes" class="modes">
      <button class="mode-button selected" data-mode="return">Return</button>
      <button class="mode-button" data-mode="volley">Volley</button>
      <button class="mode-button" data-mode="rally">Return + Rally</button>
    </div>
    <button id="start" class="big-button">Start</button>
    <p id="load-status" class="note"></p>
    <button id="open-settings" class="plain-button">Settings</button>
    <p class="note">No sound? Check the silent switch on the side of your iPhone and turn the volume up.</p>
    <p class="version">Version 0.4</p>
  </main>

  <!-- Settings screen: the sliders are added by app.js -->
  <section id="settings-screen" class="screen settings" hidden>
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="close-settings" class="plain-button">Done</button>
    </div>
    <div class="setting">
      <span class="setting-label">Handedness</span>
      <div class="choice">
        <button class="hand-button" data-hand="right">Right</button>
        <button class="hand-button" data-hand="left">Left</button>
      </div>
    </div>
    <div id="sliders"></div>
    <button id="reset-settings" class="plain-button reset">Reset to defaults</button>
  </section>

  <!-- Session screen: neutral / forehand / backhand / stop / rest -->
  <section id="session" class="screen neutral" hidden>
    <div id="status"></div>
    <button id="end" class="end-button">End</button>
    <svg id="arrow" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="0,30 50,30 50,0 100,50 50,100 50,70 0,70" />
    </svg>
    <div id="message"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
